<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>VYRAX Compliance Dashboard</title>
    <style>
      :root {
        --cream: #f7f2e2;
        --cream2: #e4ead2;
        --card: #fcfaf0;
        --ink: #1d2b22;
        --mute: #667366;
        --line: #d9d1b8;
        --g9: #143626;
        --g7: #1f5a3d;
        --g5: #3a8559;
        --g2: #cfe3cf;
        --amber: #b8861b;
        --red: #a63d2f;
        --side: #dde6c9;
        --sidetxt: #24402f;
      }
      :root[data-pal="mint"] {
        --cream: #fbf8ee;
        --cream2: #e1efe4;
        --card: #fffdf7;
        --line: #d3e0d2;
        --g2: #cde6d4;
        --side: #d8ebdc;
        --sidetxt: #1f4a33;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow-x: hidden;
      }
      body {
        background: var(--cream);
        color: var(--ink);
        font:
          15px/1.5 "Segoe UI",
          system-ui,
          sans-serif;
        display: flex;
        padding-top: env(safe-area-inset-top, 0px);
      }
      h1,
      h2,
      h3 {
        font-family: Georgia, "Times New Roman", serif;
        font-weight: 600;
        margin: 0;
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--g5);
        outline-offset: 2px;
      }
      aside {
        width: 236px;
        background: var(--side);
        border-right: 1px solid var(--line);
        color: var(--sidetxt);
        padding: 22px 14px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        flex-shrink: 0;
        overflow-y: auto;
      }
      .brand {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 0 8px 18px;
      }
      .mark {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--g7);
        display: grid;
        place-items: center;
        color: var(--cream);
        font:
          700 17px Georgia,
          serif;
      }
      .brand b {
        font:
          600 18px Georgia,
          serif;
        display: block;
        line-height: 1.1;
      }
      .brand small {
        opacity: 0.65;
        font-size: 12px;
      }
      nav button {
        display: flex;
        gap: 12px;
        align-items: center;
        width: 100%;
        background: none;
        border: 0;
        border-radius: 10px;
        padding: 10px 12px;
        color: inherit;
        cursor: pointer;
        text-align: left;
        opacity: 0.82;
      }
      nav button:hover {
        background: rgba(31, 90, 61, 0.09);
        opacity: 1;
      }
      nav button[aria-current="page"] {
        background: var(--g7);
        color: var(--cream);
        opacity: 1;
        font-weight: 600;
      }
      nav svg {
        width: 18px;
        height: 18px;
        flex: none;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .badge {
        margin-left: auto;
        background: var(--amber);
        color: #fff;
        font-size: 11px;
        border-radius: 9px;
        padding: 0 7px;
      }
      .who {
        margin-top: auto;
        padding: 12px 8px 0;
        border-top: 1px solid rgba(31, 90, 61, 0.18);
        font-size: 13px;
      }
      .who span {
        opacity: 0.65;
        display: block;
      }
      main {
        flex: 1;
        min-width: 0;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 28px 34px 40px;
        background: linear-gradient(
          155deg,
          var(--cream) 0%,
          var(--cream) 45%,
          var(--cream2) 100%
        );
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 22px;
      }
      .top h1 {
        font-size: 30px;
      }
      .top p {
        margin: 2px 0 0;
        color: var(--mute);
      }
      .btn {
        background: var(--g7);
        color: #fff;
        border: 0;
        border-radius: 9px;
        padding: 9px 16px;
        cursor: pointer;
      }
      .btn:hover {
        background: var(--g9);
      }
      .btn.ghost {
        background: transparent;
        color: var(--g7);
        border: 1px solid var(--g5);
      }
      .btn.ghost:hover {
        background: var(--g2);
      }
      .grid {
        display: grid;
        gap: 16px;
      }
      .k {
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      }
      .two {
        grid-template-columns: 1.6fr 1fr;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 18px;
      }
      .card h3 {
        font-size: 18px;
        margin-bottom: 12px;
      }
      .kpi b {
        font:
          600 32px Georgia,
          serif;
        color: var(--g7);
        display: block;
        line-height: 1.1;
      }
      .kpi span {
        color: var(--mute);
        font-size: 13px;
      }
      .kpi em {
        font-style: normal;
        font-size: 12px;
        color: var(--g5);
      }
      .kpi.warn b {
        color: var(--amber);
      }
      .flow {
        display: flex;
        height: 14px;
        border-radius: 7px;
        overflow: hidden;
        margin: 6px 0 10px;
        background: var(--cream2);
      }
      .legend {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        font-size: 13px;
        color: var(--mute);
      }
      .legend i {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 3px;
        margin-right: 6px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      th {
        text-align: left;
        font-weight: 600;
        color: var(--mute);
        padding: 8px 10px;
        border-bottom: 1px solid var(--line);
        font-size: 13px;
      }
      td {
        padding: 10px;
        border-bottom: 1px solid var(--line);
      }
      tr:last-child td {
        border: 0;
      }
      tbody tr.click {
        cursor: pointer;
      }
      tbody tr.click:hover {
        background: var(--cream2);
      }
      .tbl {
        overflow: visible;
      }
      .pill {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 99px;
        font-size: 12px;
        font-weight: 600;
      }
      .s-Approved {
        background: var(--g2);
        color: var(--g7);
      }
      .s-Under {
        background: #efe2b8;
        color: #7a5a0c;
      }
      .s-Flagged {
        background: #f0cfc8;
        color: var(--red);
      }
      .s-Pending {
        background: var(--cream2);
        color: var(--mute);
      }
      .bar {
        height: 8px;
        border-radius: 4px;
        background: var(--cream2);
        min-width: 70px;
      }
      .bar i {
        display: block;
        height: 100%;
        border-radius: 4px;
        background: var(--g5);
      }
      .tools {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }
      .tools input,
      .tools select {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 8px 12px;
      }
      .tools input {
        flex: 1;
        min-width: 180px;
      }
      .item {
        display: flex;
        gap: 12px;
        padding: 12px 0;
        border-bottom: 1px solid var(--line);
      }
      .item:last-child {
        border: 0;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        margin-top: 7px;
        flex: none;
      }
      .item small {
        color: var(--mute);
        display: block;
      }
      .chk {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px 14px;
        align-items: center;
      }
      .ok {
        color: var(--g5);
        font-weight: 600;
      }
      .no {
        color: var(--red);
        font-weight: 600;
      }
      .wt {
        color: var(--amber);
        font-weight: 600;
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 14px;
        padding: 13px 0;
        border-bottom: 1px solid var(--line);
      }
      .row:last-child {
        border: 0;
      }
      .row small {
        color: var(--mute);
        display: block;
      }
      .sw {
        appearance: none;
        width: 42px;
        height: 24px;
        border-radius: 12px;
        background: var(--line);
        position: relative;
        cursor: pointer;
        flex: none;
        transition: background 0.15s;
      }
      .sw::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #fff;
        transition: left 0.15s;
      }
      .sw:checked {
        background: var(--g5);
      }
      .sw:checked::after {
        left: 21px;
      }
      .toast {
        position: fixed;
        bottom: calc(20px + env(safe-area-inset-bottom, 0px));
        left: 50%;
        transform: translateX(-50%);
        background: var(--g9);
        color: #fff;
        padding: 10px 18px;
        border-radius: 10px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
      }
      .toast.on {
        opacity: 1;
      }
      .pal {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .palb {
        display: flex;
        align-items: center;
        gap: 6px;
        background: var(--card);
        border: 1.5px solid var(--line);
        border-radius: 10px;
        padding: 6px 12px;
        cursor: pointer;
      }
      .palb[aria-pressed="true"] {
        border-color: var(--g7);
        font-weight: 600;
      }
      .palb i {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 1px solid var(--line);
      }
      .form {
        display: grid;
        gap: 14px;
        max-width: 640px;
      }
      .form label {
        display: grid;
        gap: 5px;
        font-weight: 600;
        font-size: 14px;
      }
      .form input:not([type="checkbox"]),
      .form select,
      .form textarea {
        background: var(--cream);
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 9px 12px;
        font-weight: 400;
        width: 100%;
      }
      .form fieldset {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 14px;
        margin: 0;
      }
      .form .ck {
        display: flex;
        gap: 8px;
        align-items: center;
        font-weight: 400;
        padding: 3px 0;
      }
      .err {
        color: var(--red);
        min-height: 1.2em;
        font-size: 14px;
      }
      .empty {
        text-align: center;
        padding: 26px 10px;
        color: var(--mute);
      }
      .empty p {
        margin: 0 0 12px;
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      #auth {
        display: none;
        flex: 1;
        align-items: center;
        justify-content: center;
        padding: 24px;
        min-height: 100vh;
        background: linear-gradient(
          155deg,
          var(--cream) 0%,
          var(--cream) 45%,
          var(--cream2) 100%
        );
      }
      body.locked #auth {
        display: flex;
      }
      body.locked aside,
      body.locked main {
        display: none;
      }
      .acard {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 28px;
        width: 100%;
        max-width: 400px;
      }
      .acard h1 {
        font-size: 26px;
      }
      .sub {
        color: var(--mute);
        margin: 4px 0 16px;
      }
      .acard a {
        color: var(--g7);
        font-weight: 600;
      }
      .who b {
        display: block;
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      .who span {
        overflow-wrap: anywhere;
      }
      .card {
        box-shadow:
          0 1px 2px rgba(31, 90, 61, 0.05),
          0 12px 28px -16px rgba(31, 90, 61, 0.28);
      }
      .two > *,
      .grid > * {
        min-width: 0;
      }
      .card.kpi {
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }
      .card.kpi:hover {
        transform: translateY(-3px);
        box-shadow: 0 14px 30px -14px rgba(31, 90, 61, 0.4);
      }
      .kic {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background: var(--g2);
        display: grid;
        place-items: center;
        margin-bottom: 12px;
      }
      .kic svg {
        width: 20px;
        height: 20px;
        stroke: var(--g7);
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .kpi.warn .kic {
        background: #f0e0b4;
      }
      .kpi.warn .kic svg {
        stroke: var(--amber);
      }
      .hero {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        background: linear-gradient(120deg, var(--g9), var(--g7));
        color: #f7f2e2;
        border-radius: 20px;
        padding: 28px 32px;
        margin-bottom: 18px;
        overflow: hidden;
        box-shadow: 0 18px 36px -20px rgba(20, 54, 38, 0.7);
      }
      .hero h1 {
        font-size: 30px;
        color: #f7f2e2;
      }
      .hero p {
        margin: 6px 0 18px;
        opacity: 0.88;
        max-width: 440px;
      }
      .hero .art {
        width: 250px;
        flex: none;
      }
      .btn {
        transition:
          background 0.15s,
          transform 0.1s,
          box-shadow 0.15s;
        box-shadow: 0 3px 8px -3px rgba(31, 90, 61, 0.55);
      }
      .btn:active {
        transform: scale(0.97);
      }
      .btn.ghost {
        box-shadow: none;
      }
      .btn.light {
        background: #f7f2e2;
        color: var(--g9);
      }
      .btn.light:hover {
        background: #fff;
      }
      .mark {
        background: linear-gradient(135deg, var(--g5), var(--g9));
        color: #f7f2e2;
      }
      nav button {
        transition:
          background 0.15s,
          transform 0.15s;
      }
      nav button:hover {
        transform: translateX(3px);
      }
      nav button[aria-current="page"] {
        box-shadow: 0 6px 14px -6px rgba(20, 54, 38, 0.6);
      }
      nav button[aria-current="page"]:hover {
        transform: none;
      }
      .av {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: var(--g7);
        color: #f7f2e2;
        display: grid;
        place-items: center;
        font-weight: 600;
        font-size: 13px;
        flex: none;
      }
      .whor {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .pill::before {
        content: "";
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
        margin-right: 6px;
        vertical-align: 1px;
      }
      tbody tr {
        transition: background 0.15s;
      }
      .bar i {
        animation: fill 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }
      @keyframes fill {
        from {
          width: 0;
        }
      }
      .bg {
        transform-box: fill-box;
        transform-origin: bottom;
        animation: grow 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }
      @keyframes grow {
        from {
          transform: scaleY(0);
        }
      }
      .seg {
        animation: draw 1s cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }
      @keyframes draw {
        from {
          stroke-dasharray: 0 var(--c);
        }
      }
      .dwrap {
        display: flex;
        align-items: center;
        gap: 22px;
        flex-wrap: wrap;
      }
      .donut {
        width: 160px;
        flex: none;
      }
      .legend.col {
        flex-direction: column;
        gap: 9px;
      }
      .eg {
        display: block;
        margin: 0 auto 8px;
        width: 112px;
      }
      .cmp :is(th, td):is(:nth-child(3), :nth-child(4)) {
        display: none;
      }
      main > * {
        animation: rise 0.55s cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }
      main > *:nth-child(2) {
        animation-delay: 0.07s;
      }
      main > *:nth-child(3) {
        animation-delay: 0.14s;
      }
      main > *:nth-child(4) {
        animation-delay: 0.21s;
      }
      main > *:nth-child(n + 5) {
        animation-delay: 0.28s;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
      }
      main.quiet * {
        animation: none !important;
      }
      .float {
        animation: float 6s ease-in-out infinite;
      }
      @keyframes float {
        50% {
          transform: translateY(-6px);
        }
      }
      .toast {
        display: flex;
        gap: 10px;
        align-items: center;
        transform: translate(-50%, 14px);
        transition:
          opacity 0.25s,
          transform 0.25s;
        box-shadow: 0 12px 28px -10px rgba(20, 54, 38, 0.6);
      }
      .toast.on {
        transform: translate(-50%, 0);
      }
      .toast::before {
        content: "\2713";
        background: var(--g5);
        border-radius: 50%;
        width: 20px;
        height: 20px;
        display: grid;
        place-items: center;
        font-size: 12px;
        flex: none;
      }
      .asplit {
        display: grid;
        grid-template-columns: 1.05fr 1fr;
        width: 100%;
        max-width: 880px;
        border-radius: 22px;
        overflow: hidden;
        border: 1px solid var(--line);
        box-shadow: 0 30px 60px -30px rgba(20, 54, 38, 0.5);
        animation: rise 0.6s cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }
      .apanel {
        background: linear-gradient(150deg, var(--g9), var(--g7));
        color: #f7f2e2;
        padding: 34px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 16px;
      }
      .apanel h2 {
        font-size: 26px;
        color: #f7f2e2;
        line-height: 1.2;
      }
      .apanel ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 10px;
      }
      .apanel li {
        display: flex;
        gap: 10px;
        align-items: center;
        opacity: 0.92;
      }
      .apanel .art {
        width: 100%;
        max-width: 260px;
      }
      .asplit .acard {
        border: 0;
        border-radius: 0;
        max-width: none;
        box-shadow: none;
      }
      @media (max-width: 760px) {
        .asplit {
          grid-template-columns: 1fr;
        }
        .apanel {
          display: none;
        }
        .hero .art {
          display: none;
        }
        .hero {
          padding: 22px;
        }
      }

      .btn,
      nav button,
      .palb {
        position: relative;
        overflow: hidden;
      }
      .rip {
        position: absolute;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.5);
        transform: scale(0);
        animation: rip 0.65s ease-out forwards;
        pointer-events: none;
      }
      .btn.ghost .rip,
      nav button .rip,
      .palb .rip {
        background: rgba(31, 90, 61, 0.22);
      }
      nav button[aria-current="page"] .rip {
        background: rgba(255, 255, 255, 0.4);
      }
      @keyframes rip {
        to {
          transform: scale(1);
          opacity: 0;
        }
      }
      .btn {
        background: linear-gradient(135deg, var(--g5), var(--g7));
        border: 0;
      }
      .btn::after {
        content: "";
        position: absolute;
        top: 0;
        left: -75%;
        width: 45%;
        height: 100%;
        background: linear-gradient(
          100deg,
          transparent,
          rgba(255, 255, 255, 0.5),
          transparent
        );
        transform: skewX(-20deg);
        transition: left 0.65s ease;
        pointer-events: none;
      }
      .btn:hover {
        background: linear-gradient(135deg, var(--g7), var(--g9));
        transform: translateY(-2px);
        box-shadow: 0 12px 22px -10px rgba(31, 90, 61, 0.8);
      }
      .btn:hover::after {
        left: 135%;
      }
      .btn:active {
        transform: translateY(0) scale(0.96);
        box-shadow: 0 2px 6px -2px rgba(31, 90, 61, 0.6);
      }
      .btn.ghost {
        background: linear-gradient(var(--g7), var(--g7)) no-repeat 0 100%/100%
          0;
        transition:
          background-size 0.3s ease,
          color 0.25s,
          transform 0.15s,
          box-shadow 0.2s;
      }
      .btn.ghost:hover {
        background: linear-gradient(var(--g7), var(--g7)) no-repeat 0 100%/100%
          100%;
        color: #f7f2e2;
      }
      .btn.ghost::after {
        display: none;
      }
      .btn.light {
        background: #f7f2e2;
      }
      .btn.light:hover {

    <script>
      const ICONS = {
        dashboard:
          '<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
        applications:

        verification:
          '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5L16 9.5"/>',
        alerts:
          '<path d="M6 17V11a6 6 0 1112 0v6l2 2H4z"/><path d="M10 21h4"/>',
        reports:
          '<path d="M4 20V4M4 20h16"/><path d="M8 16v-4M12 16V8M16 16v-6"/>',
        audit: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
        settings:
          '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',
        flag: '<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',
        check:
          '<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/>',
        docplus:
          '<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M12 11v6M9 14h6"/>',
        identify: '<path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v4h16v-4"/>',
        compliance:
          '<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 12.5l2 2 4-4.5M9 18h6"/>',
      };
      const VIEWS = [
        ["dashboard", "Dashboard"],
        ["applications", "Applications"],
        ["identify", "Identify Category"],
        ["verification", "Verification"],
        ["compliance", "Compliance"],
        ["alerts", "Alerts"],
        ["reports", "Reports"],
        ["audit", "Audit Trail"],
        ["settings", "Settings"],
      ];
      const TYPES = [
        "New institution",
        "New course",
        "Intake increase",
        "Extension of approval",
        "Closure of course",
      ];
      const STATES = [
        "Andhra Pradesh",
        "Karnataka",
        "Kerala",
        "Tamil Nadu",
        "Telangana",
        "Other state or union territory",
      ];
      const DOCL = [
        "Land ownership deed",
        "Building plan approval",
        "Fire safety certificate",
        "Faculty qualification list",
        "Audited financial statement",
      ];
      const A = () => store.apps || (store.apps = []),
        AC = () =>
          A().filter((a) => a.status == "Flagged" || a.status == "Pending docs")
            .length;
      const LOG = (who, t, area) => {
        (store.audit || (store.audit = [])).unshift([
          new Date().toLocaleString("en-IN", {
            day: "numeric",
            month: "short",
            hour: "2-digit",
            minute: "2-digit",
          }),
          user ? user.name : who,
          t,
          area,
        ]);
        save();
      };
      const esc = (x) =>
        String(x).replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      const empty = (t, b) =>
        `<div class="empty"><svg class="eg" viewBox="0 0 120 90" aria-hidden="true"><ellipse cx="60" cy="80" rx="34" ry="6" fill="var(--cream2)"/><rect x="34" y="14" width="46" height="58" rx="6" fill="var(--g2)" transform="rotate(-6 57 43)"/><rect x="42" y="10" width="46" height="60" rx="6" fill="var(--card)" stroke="var(--g5)" stroke-width="2"/><path d="M50 26h30M50 36h30M50 46h18" stroke="var(--g5)" stroke-width="3" stroke-linecap="round"/><circle cx="86" cy="62" r="13" fill="var(--g7)"/><path d="M80 62l4 4 7-8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><p>${t}</p>${b || ""}</div>`;
      function dl() {
        const rows = [
          [
            "ID",
            "Institution",
            "State",
            "Type",
            "Status",
            "Documents",
            "Contact",
            "Filed",
          ],
        ].concat(
          A().map((a) => [
            a.id,
            a.name,
            a.state,
            a.type,
            a.status,
            a.docs.length + " of 5",
            a.email,
            a.date,
          ]),
        );
        const l = document.createElement("a");
        l.href = URL.createObjectURL(
          new Blob(
            [
              rows
                .map((r) =>
                  r
                    .map((c) => '"' + String(c).replace(/"/g, '""') + '"')
                    .join(","),
                )
                .join("\n"),
            ],
            { type: "text/csv" },
          ),
        );
        l.download = "applications.csv";
        l.click();
        toast("Exported applications.csv");

      const COL = {
        Approved: "var(--g5)",
        "Under review": "var(--amber)",
        Flagged: "var(--red)",
        "Pending docs": "#c9bf98",
      };

        pill = (s) => `<span class="pill s-${s.split(" ")[0]}">${s}</span>`;
      let state = { q: "", f: "All" },
        store = {};
      try {
        store = JSON.parse(localStorage.getItem("aicte") || "{}");
      } catch (e) {}
      function save() {
        try {
          localStorage.setItem("aicte", JSON.stringify(store));
        } catch (e) {}
      }
      function toast(t) {
        const e = $("#toast");

      function head(t, p, btn) {
        return `<div class="top"><div><h1>${t}</h1><p>${p}</p></div>${btn || ""}</div>`;
      }
      function table(rows, cp) {
        return rows.length
          ? `<div class="tbl"><table class="apps${cp ? " cmp" : ""}"><thead><tr><th>ID</th><th>Institution</th><th>State</th><th>Type</th><th>Status</th><th>Documents</th><th>Filed</th></tr></thead><tbody>${rows.map((a) => `<tr class="click" data-id="${a.id}"><td>${a.id}</td><td>${esc(a.name)}</td><td>${a.state}</td><td>${a.type}</td><td>${pill(a.status)}</td><td><div class="bar"><i style="width:${a.docs.length * 20}%"></i></div>${a.docs.length} of 5</td><td>${a.date}</td></tr>`).join("")}</tbody></table></div>`

              "No applications yet.",
              `<button class="btn" data-go="new">Submit an application</button>`,
            );

      function chart() {
        const n = [...Array(7)].map((_, i) => {
            const d = new Date();
            d.setHours(0, 0, 0, 0);
            d.setDate(d.getDate() - 6 + i);
            return [
              d.toLocaleDateString("en-IN", { weekday: "short" }),
              A().filter((a) => {
                const t = new Date(a.ts);
                t.setHours(0, 0, 0, 0);
                return +t == +d;
              }).length,
            ];
          }),
          m = Math.max(3, ...n.map((x) => x[1])),
          k = 130 / m;

      }
      const R = {
        dashboard() {
          const a = A(),
            c = (s) => a.filter((x) => x.status == s).length,
            t = a.length,
            att = a.filter(
              (x) => x.status == "Flagged" || x.status == "Pending docs",
            );
          return (
            `<section class="hero"><div><h1>Welcome back, ${esc(user.name.split(" ")[0])}</h1><p>${new Date().toLocaleDateString("en-IN", { weekday: "long", day: "numeric", month: "long" })}. ${t ? "Here is where your applications stand." : "Submit your first application to get started."}</p><button class="btn light" data-go="new">New application</button></div>${ART}</section>` +
            `<div class="grid k">${[
              [t, "Submitted", "applications"],
              [c("Under review"), "Under review", "audit"],
              [c("Pending docs"), "Waiting for documents", "docplus"],
              [c("Flagged"), "Flagged", "flag"],
              [c("Approved"), "Approved", "check"],

              .map(
                (x) =>
                  `<div class="card kpi${x[1] == "Flagged" && x[0] ? " warn" : ""}"><div class="kic"><svg viewBox="0 0 24 24">${ICONS[x[2]]}</svg></div><b data-n="${x[0]}">${x[0]}</b><span>${x[1]}</span></div>`,

            `<div class="grid two" style="margin-top:16px"><div class="card"><h3>Submitted in the last 7 days</h3>${chart()}</div><div class="card"><h3>Where applications stand</h3>${
              t
                ? `<div class="dwrap">${donut(a)}<div class="legend col">${Object.keys(
                    COL,

                    .join("") +

        },

          const a = A(),
            rows = a.filter(
              (x) =>
                (state.f == "All" || x.status == state.f) &&
                (x.id + x.name + x.state + x.type)
                  .toLowerCase()
                  .includes(state.q.toLowerCase()),
            );
          return (
            head(

          return m;
        };
        const dev = () => {
          try {
            let d = localStorage.getItem("vyrax_dev");
            if (!d) {
              d = crypto.randomUUID();
              localStorage.setItem("vyrax_dev", d);
            }
            return d;
          } catch (_) {
            return "x";
          }
        };
        async function check() {
          const u = user.username || user.email;
          if (store.chatUser && store.chatUser != u)
            return "This device’s assistant is registered to another account. Only one user can use it on a device.";
          try {
            const db = await claude.use("db");
            if (db) {
              const r = db.doc("chatdevices/" + u),
                s = await r.get();
              if (s.exists && (s.data() || {}).device != dev())
                return "Your account’s assistant is registered to a different device. Only one device can use it per account.";
              if (!s.exists) await r.set({ device: dev() });
              sh = true;
            }
          } catch (_) {}
          store.chatUser = u;
          save();
          return "";
        }
        async function send(t) {
          busy = true;
          add("u", t);
          H.push({ role: "user", content: t });
          H = H.slice(-8);
          if (H[0].role != "user") H.shift();
          const o = add("b", "…");
          try {
            const s = await claude.use("sample");
            if (!s) throw { code: "na" };
            const ctx = JSON.stringify(
                A()
                  .slice(0, 15)
                  .map((a) => ({
                    id: a.id,
                    name: a.name,
                    type: a.type,
                    status: a.status,
                    missing: DOCL.filter((d) => !a.docs.includes(d)),
                  })),
              ),
              m = H.map((x, i) =>
                i
                  ? x
                  : {
                      role: "user",
                      content:
                        INS +
                        "\n\nThe user’s applications: " +
                        ctx +
                        "\n\nQuestion: " +
                        x.content,
                    },
              ),
              r = await s(m, {
                cache: false,
                modelTier: "quick",
                onText: (u) => {
                  o.textContent = u.text;
                },
              });
            o.textContent = r.text;
            H.push({ role: "assistant", content: r.text });
          } catch (e) {
            o.textContent =
              e && e.code == "not_granted"
                ? "Permission to use the assistant was declined."
                : e && e.code == "rate_limited"
                  ? "Too many questions. Please wait a moment."
                  : "The assistant is not available here right now.";
            H.pop();
          }
          busy = false;
        }
        const go = () => {
          const t = I.value.trim();
          if (gate || busy || !t) return;
          I.value = "";
          send(t);
        };
        S.onclick = go;
        I.onkeydown = (e) => {
          if (e.key === "Enter" && !e.isComposing) go();
        };
        $("#cx").onclick = () => {
          p.hidden = true;
        };
        b.onclick = async () => {
          p.hidden = !p.hidden;
          if (p.hidden) return;
          I.focus();
          if (gate === null) {
            add("b", "Checking this device…");
            gate = await check();
            L.innerHTML = "";
            I.disabled = S.disabled = !!gate;
            add(
              "b",
              gate ||
                "Hi " +
                  user.name.split(" ")[0] +
                  ", ask me about the required documents, application types or the status of your applications." +
                  (sh
                    ? ""
                    : " Note: the one-device lock is checked on this device only in this preview."),
            );
          }
        };
        window.cbShow = () => {
          b.hidden = !user;
          if (!user) {
            p.hidden = true;
            gate = null;
            H = [];
            L.innerHTML = "";
            I.disabled = S.disabled = false;
          }
        };
        const _rd = render;
        render = function () {
          _rd();
          cbShow();
        };
      })();
      addEventListener("hashchange", render);
      theme();
      sess();
      apiInit().finally(render);
    </script>
  </body>
</html>
